# Repository connection — Token (HTTPS)
# ---------------------------------------------------------------------------
# Steps:
#   1. Create a personal access token
#        GitHub: avatar -> Settings -> Developer settings
#                -> Personal access tokens -> Tokens (classic)
#                -> Generate new token -> scope: repo
#        GitLab: Settings -> Access Tokens -> scope: read_repository
#   2. Put the token in the "password" field below
#   3. kubectl apply -f 03-repo-token-secret.yaml
#
# The url MUST be the HTTPS form. A git@ url will not authenticate with a token.
# The token goes in "password", NEVER in "username".
#
# DO NOT COMMIT A REAL TOKEN. See the "Keeping secrets out of Git"
# section of ../setup.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: repo-my-repo-https
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  name: my-repo-https                          # display name in the UI
  url: https://github.com/my-org/my-repo.git

  # Optional: scope this credential to one project.
  project: development

  username: my-github-username
  password: REPLACE_WITH_YOUR_TOKEN            # <- the PAT goes here
