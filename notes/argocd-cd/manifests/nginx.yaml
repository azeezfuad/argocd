# Argo CD Application
# ---------------------------------------------------------------------------
# repo + path + revision  ->  cluster + namespace
#
# Apply with:  kubectl apply -f nginx.yaml
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: s11-s12

  source:
    repoURL: https://github.com/devopstia/s12-s11-argocd.git

    targetRevision: main
    path: nginx

  destination:
    server: https://kubernetes.default.svc
    # Where the nginx workload lands. This must match:
    #   - metadata.name in nginx/namespace.yaml
    #   - an entry in the s11-s12 project's destinations
    # NEVER 'argocd' — that is where Argo CD itself lives, not your workloads.
    namespace: development

  syncPolicy:
    automated:
      prune: true                 # delete resources removed from Git
      selfHeal: true              # revert manual kubectl changes
      enabled: true
    syncOptions:
      - CreateNamespace=true      # create the destination namespace
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m