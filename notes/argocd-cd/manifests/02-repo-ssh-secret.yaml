# Repository connection — SSH
# ---------------------------------------------------------------------------
# Argo CD reads repository credentials from Secrets in the argocd namespace
# that carry the label:  argocd.argoproj.io/secret-type: repository
#
# Steps:
#   1. ssh-keygen -t ed25519 -C "argocd" -f ~/.ssh/argocd_ed25519 -N ""
#   2. Add ~/.ssh/argocd_ed25519.pub to the repo as a DEPLOY KEY
#        GitHub: repo -> Settings -> Deploy keys -> Add deploy key
#   3. Paste ~/.ssh/argocd_ed25519 (the PRIVATE key) below
#   4. kubectl apply -f 02-repo-ssh-secret.yaml
#
# The url MUST be the SSH form (git@...). An https:// url will not
# authenticate with an SSH key.
#
# DO NOT COMMIT A REAL PRIVATE KEY. See the "Keeping secrets out of Git"
# section of ../setup.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: repo-my-repo-ssh
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  name: my-repo-ssh                      # display name in the UI
  url: git@github.com:my-org/my-repo.git

  # Optional: scope this credential to one project instead of the whole instance.
  project: development

  # Paste the ENTIRE private key, including the BEGIN and END lines.
  # Indentation under the block scalar must be kept.
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END OPENSSH PRIVATE KEY-----

  # Set to "true" only in a lab, to skip SSH host key verification.
  # insecure: "true"
