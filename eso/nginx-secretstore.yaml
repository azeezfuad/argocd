
# kubectl create secret generic vault-auth \
#   --from-literal=username="deploy" \
#   --from-literal=password="syndrome-casings-shipped-bartlet" \
#   --namespace=connected-backend

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: webforx-vault-backend
  namespace: connected-backend
spec:
  provider:
    vault:
      server: https://vault.edusuc.net
      path: Dev-secret
      version: v2
      auth:
        userPass:
          path: userpass
          username: deploy              
          secretRef:
            name: vault-auth
            key: password   
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connected-backend
  namespace: connected-backend
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: webforx-vault-backend
    kind: SecretStore
  target:
    name: connected-backend
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: CONNECT_BACKEND
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: connected-backend
data:
  DUMMY_KEY: "dummy_value"
  ANOTHER_KEY: "another_value"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
  namespace: connected-backend
  annotations:
    secret.reloader.stakater.com/reload: "dev"
    configmap.reloader.stakater.com/reload: "config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: connected-backend
            - configMapRef:
                name: config