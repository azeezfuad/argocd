---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nginx-secret
  namespace: nginx
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: eso-auth
    kind: ClusterSecretStore
  target:
    name: nginx-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: Jenkins
  - extract:
      key: minio
  - extract:
      key: bastion
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: nginx
data:
  DUMMY_KEY: "dummy_value"
  ANOTHER_KEY: "another_value"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
  namespace: nginx
  annotations:
    secret.reloader.stakater.com/reload: "nginx-secret"
    # configmap.reloader.stakater.com/reload: "config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: nginx-secret
            - configMapRef:
                name: config